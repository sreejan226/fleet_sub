services:
  redis:
    image: redis:7.4.1-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      control-plane:
        condition: service_started

  control-plane:
    build: .
    environment:
      GF_REDIS_URL: redis://redis:6379/0
      GF_SQLITE_PATH: /data/fleet.db
      GF_FLEET_YAML: /app/fleet.yaml
      GF_ROLE: control-plane
      GF_INLINE_WORKERS: "0"
      GF_TICK_SECONDS: "2"
    volumes:
      - fleet-data:/data
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  worker-io:
    build: .
    command: ["python", "-m", "generation_fleet", "worker"]
    environment:
      GF_REDIS_URL: redis://redis:6379/0
      GF_SQLITE_PATH: /data/fleet.db
      GF_FLEET_YAML: /app/fleet.yaml
      GF_ROLE: worker
      GF_WORKER_POOL: io
      GF_WORKER_IO_CONCURRENCY: "4"
    volumes:
      - fleet-data:/data
    depends_on:
      redis:
        condition: service_healthy
      control-plane:
        condition: service_started

  worker-cpu:
    build: .
    command: ["python", "-m", "generation_fleet", "worker"]
    environment:
      GF_REDIS_URL: redis://redis:6379/0
      GF_SQLITE_PATH: /data/fleet.db
      GF_FLEET_YAML: /app/fleet.yaml
      GF_ROLE: worker
      GF_WORKER_POOL: cpu
      GF_WORKER_CPU_CONCURRENCY: "2"
    volumes:
      - fleet-data:/data
    depends_on:
      redis:
        condition: service_healthy
      control-plane:
        condition: service_started

volumes:
  fleet-data:
